# Top-level settings (outside http block)

# Top-level directives (main context only)
worker_processes auto;

# PID must be here — top level!
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Redirect ALL temp paths to /tmp to avoid permission denied in OpenShift
    client_body_temp_path   /tmp/nginx_client_body_temp  1 2;
    proxy_temp_path         /tmp/nginx_proxy_temp        1 2;
    fastcgi_temp_path       /tmp/nginx_fastcgi_temp      1 2;
    uwsgi_temp_path         /tmp/nginx_uwsgi_temp        1 2;
    scgi_temp_path          /tmp/nginx_scgi_temp         1 2;

    # Disable proxy cache path to prevent fallback to /var/cache/nginx
    proxy_cache_path off;

    # Logs to /tmp (safe for non-root)
    error_log /tmp/nginx_error.log warn;
    access_log /tmp/nginx_access.log;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        error_page 404 /index.html;
    }
}